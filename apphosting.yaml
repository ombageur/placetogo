# Firebase App Hosting (development). Salin/variasikan untuk production (apphosting.production.yaml).
# Tidak ada nilai rahasia di file ini; secret dirujuk dari Secret Manager.
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0     # biaya nol saat idle; naikkan hanya jika cold start terukur bermasalah
  maxInstances: 5     # batas biaya; budget alert BUKAN hard cap
  concurrency: 80
env:
  - variable: NEXTJS_ADAPTER_VERSION
    value: "latest"
    availability: [BUILD]
  - variable: NODE_PATH
    value: "/workspace/apps/web/node_modules:/workspace/node_modules"
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_APP_ENV
    value: development
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: "false"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: placetogo-id
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAQIpWr0cLlljXtAFH20r5EGHUnDlzZmUU
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: placetogo-id.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:434364277109:web:88e287b0921f1baa3a733c
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: placetogo-id.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "434364277109"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-VTH11F3R4R
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: https://placetogo-api-434364277109.asia-southeast2.run.app
    availability: [BUILD, RUNTIME]
